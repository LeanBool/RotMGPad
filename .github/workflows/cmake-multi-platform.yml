name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsdl2-dev \
            libx11-dev \
            libxfixes-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglfw3-dev \
            libfreetype-dev \
            libglm-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build --prefix dist

      - name: Package binary
        run: tar -czf GamePadRealm-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: GamePadRealm-linux
          path: GamePadRealm-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          vcpkg install sdl2:x64-windows glfw3:x64-windows freetype:x64-windows glm:x64-windows

      - name: Configure
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix dist

      - name: Copy runtime DLLs
        shell: pwsh
        run: |
          $bin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"

          Copy-Item "$bin\*.dll" dist\

      - name: Package binary
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath GamePadRealm-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GamePadRealm-windows
          path: GamePadRealm-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GamePadRealm-linux

      - uses: actions/download-artifact@v4
        with:
          name: GamePadRealm-windows

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            GamePadRealm-linux-x86_64.tar.gz
            GamePadRealm-windows-x86_64.zip
          generate_release_notes: true
